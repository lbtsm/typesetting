# 放到 /etc/nginx/conf.d/md2wechat.conf；root 指向发布脚本维护的 current 软链
server {
    listen 80;
    server_name _;  # 有域名就换成域名

    root /var/www/md2wechat/current;
    index index.html;

    # vite 产物带内容 hash，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发布后立即拿到新版本
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
